<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='240' viewBox='0 0 1600 240'>
  <defs>
    <!-- Crisp natural quarter-sawn oak / rich amber-walnut hardwood grain -->
    <filter id='h-grain' x='0%' y='0%' width='100%' height='100%' color-interpolation-filters='sRGB'>
      <feTurbulence type='fractalNoise' baseFrequency='0.0018 0.024' numOctaves='5' seed='142' result='macro' />
      <feTurbulence type='turbulence' baseFrequency='0.007 0.11' numOctaves='3' seed='218' result='micro' />
      <feDisplacementMap in='macro' in2='micro' scale='6' xChannelSelector='R' yChannelSelector='G' result='displaced' />
      <!-- Rich roasted walnut / medium-dark amber grain curve -->
      <feColorMatrix type='matrix' values='
        0.44 0 0 0 0.30
        0.28 0 0 0 0.19
        0.16 0 0 0 0.10
        0.75 0 0 0 0.18' in='displaced' result='grainTone'/>
    </filter>

    <!-- Fine open wood pores (delicate vessel lines) -->
    <filter id='h-pores' x='0%' y='0%' width='100%' height='100%' color-interpolation-filters='sRGB'>
      <feTurbulence type='fractalNoise' baseFrequency='0.028 0.35' numOctaves='3' seed='415' result='poreNoise' />
      <feColorMatrix type='matrix' values='
        0 0 0 0 0.12
        0 0 0 0 0.08
        0 0 0 0 0.04
        1.45 0 0 0 -0.50' in='poreNoise' result='poreTone'/>
    </filter>

    <!-- Hand-rubbed satin tooth (eliminates plastic shine) -->
    <filter id='h-tooth' x='0%' y='0%' width='100%' height='100%' color-interpolation-filters='sRGB'>
      <feTurbulence type='fractalNoise' baseFrequency='0.18 0.12' numOctaves='2' seed='108' result='toothNoise' />
      <feColorMatrix type='matrix' values='
        0.18 0 0 0 0.22
        0.18 0 0 0 0.16
        0.18 0 0 0 0.10
        0.32 0 0 0 0' in='toothNoise' result='toothTone'/>
    </filter>
  </defs>

  <!-- Medium-dark rich warm walnut base -->
  <rect width='100%' height='100%' fill='#58361b' />
  <rect width='100%' height='100%' filter='url(#h-grain)' opacity='0.88' />
  <rect width='100%' height='100%' filter='url(#h-pores)' opacity='0.55' style='mix-blend-mode: multiply;' />
  <rect width='100%' height='100%' filter='url(#h-tooth)' opacity='0.35' style='mix-blend-mode: overlay;' />
</svg>