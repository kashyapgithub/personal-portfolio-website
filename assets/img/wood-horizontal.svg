<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='240' viewBox='0 0 1600 240'>
  <defs>
    <!-- Crisp natural quarter-sawn oak / warm amber hardwood grain -->
    <filter id='h-grain' x='0%' y='0%' width='100%' height='100%' color-interpolation-filters='sRGB'>
      <feTurbulence type='fractalNoise' baseFrequency='0.0018 0.024' numOctaves='5' seed='142' result='macro' />
      <feTurbulence type='turbulence' baseFrequency='0.007 0.11' numOctaves='3' seed='218' result='micro' />
      <feDisplacementMap in='macro' in2='micro' scale='6' xChannelSelector='R' yChannelSelector='G' result='displaced' />
      <!-- Warm honey-amber tone curve: lighter, richer golden wood tones -->
      <feColorMatrix type='matrix' values='
        0.58 0 0 0 0.46
        0.42 0 0 0 0.32
        0.26 0 0 0 0.18
        0.70 0 0 0 0.15' in='displaced' result='grainTone'/>
    </filter>

    <!-- Fine open wood pores (warm umber vessel lines, distinct but delicate) -->
    <filter id='h-pores' x='0%' y='0%' width='100%' height='100%' color-interpolation-filters='sRGB'>
      <feTurbulence type='fractalNoise' baseFrequency='0.026 0.35' numOctaves='3' seed='415' result='poreNoise' />
      <feColorMatrix type='matrix' values='
        0 0 0 0 0.22
        0 0 0 0 0.15
        0 0 0 0 0.08
        1.30 0 0 0 -0.42' in='poreNoise' result='poreTone'/>
    </filter>

    <!-- Silky hand-rubbed Danish oil / beeswax satin tooth (fine light-scattering tooth) -->
    <filter id='h-tooth' x='0%' y='0%' width='100%' height='100%' color-interpolation-filters='sRGB'>
      <feTurbulence type='fractalNoise' baseFrequency='0.18 0.12' numOctaves='2' seed='108' result='toothNoise' />
      <feColorMatrix type='matrix' values='
        0.20 0 0 0 0.32
        0.20 0 0 0 0.24
        0.20 0 0 0 0.16
        0.28 0 0 0 0' in='toothNoise' result='toothTone'/>
    </filter>
  </defs>

  <!-- Lighter warm honey-oak base timber -->
  <rect width='100%' height='100%' fill='#8a5f39' />
  <!-- Crisp natural grain -->
  <rect width='100%' height='100%' filter='url(#h-grain)' opacity='0.86' />
  <!-- Open pores -->
  <rect width='100%' height='100%' filter='url(#h-pores)' opacity='0.45' style='mix-blend-mode: multiply;' />
  <!-- Soft satin surface tooth -->
  <rect width='100%' height='100%' filter='url(#h-tooth)' opacity='0.30' style='mix-blend-mode: overlay;' />
</svg>