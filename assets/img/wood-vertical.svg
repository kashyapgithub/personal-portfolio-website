<svg xmlns='http://www.w3.org/2000/svg' width='240' height='1600' viewBox='0 0 240 1600'>
  <defs>
    <filter id='v-grain' x='0%' y='0%' width='100%' height='100%' color-interpolation-filters='sRGB'>
      <feTurbulence type='fractalNoise' baseFrequency='0.024 0.0018' numOctaves='5' seed='142' result='macro' />
      <feTurbulence type='turbulence' baseFrequency='0.11 0.007' numOctaves='3' seed='218' result='micro' />
      <feDisplacementMap in='macro' in2='micro' scale='6' xChannelSelector='R' yChannelSelector='G' result='displaced' />
      <feColorMatrix type='matrix' values='
        0.44 0 0 0 0.28
        0.28 0 0 0 0.18
        0.16 0 0 0 0.09
        0.75 0 0 0 0.18' in='displaced' result='grainTone'/>
    </filter>

    <filter id='v-pores' x='0%' y='0%' width='100%' height='100%' color-interpolation-filters='sRGB'>
      <feTurbulence type='fractalNoise' baseFrequency='0.35 0.028' numOctaves='3' seed='415' result='poreNoise' />
      <feColorMatrix type='matrix' values='
        0 0 0 0 0.12
        0 0 0 0 0.08
        0 0 0 0 0.04
        1.45 0 0 0 -0.50' in='poreNoise' result='poreTone'/>
    </filter>

    <filter id='v-tooth' x='0%' y='0%' width='100%' height='100%' color-interpolation-filters='sRGB'>
      <feTurbulence type='fractalNoise' baseFrequency='0.12 0.18' numOctaves='2' seed='108' result='toothNoise' />
      <feColorMatrix type='matrix' values='
        0.18 0 0 0 0.22
        0.18 0 0 0 0.16
        0.18 0 0 0 0.10
        0.32 0 0 0 0' in='toothNoise' result='toothTone'/>
    </filter>
  </defs>

  <!-- Medium-dark rich warm walnut base -->
  <rect width='100%' height='100%' fill='#503016' />
  <rect width='100%' height='100%' filter='url(#v-grain)' opacity='0.88' />
  <rect width='100%' height='100%' filter='url(#v-pores)' opacity='0.55' style='mix-blend-mode: multiply;' />
  <rect width='100%' height='100%' filter='url(#v-tooth)' opacity='0.35' style='mix-blend-mode: overlay;' />
</svg>